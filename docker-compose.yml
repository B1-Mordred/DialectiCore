      <<: *api-ready
    volumes:
      - object-storage:/data/object-storage
      - runtime-state:/data/runtime-state
    networks:
      - backend
    healthcheck: *worker-healthcheck

  postgres:
    <<: *infrastructure-runtime-hardening
    image: ${DIALECTICORE_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dialecticore}
      POSTGRES_USER: ${POSTGRES_USER:-dialecticore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dialecticore}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dialecticore}"]
      interval: ${DIALECTICORE_POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DIALECTICORE_POSTGRES_HEALTHCHECK_RETRIES:-5}

  redis:
    <<: *infrastructure-runtime-hardening
    image: ${DIALECTICORE_REDIS_IMAGE:-redis:7-alpine}
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${DIALECTICORE_REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_REDIS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DIALECTICORE_REDIS_HEALTHCHECK_RETRIES:-5}

  minio:
    <<: *infrastructure-runtime-hardening
    image: ${DIALECTICORE_MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dialecticore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    ports:
      - "${DIALECTICORE_MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000"
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: ${DIALECTICORE_MINIO_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_MINIO_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DIALECTICORE_MINIO_HEALTHCHECK_RETRIES:-12}
      start_period: ${DIALECTICORE_MINIO_HEALTHCHECK_START_PERIOD:-10s}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  object-storage:
  runtime-state:
  backups:

networks:
  edge:
  backend:
