x-api-ready: &api-ready
  production-api:
    condition: service_healthy

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD", "python", "-m", "app.worker_healthcheck"]
  interval: ${DIALECTICORE_WORKER_HEALTHCHECK_INTERVAL:-30s}
  timeout: ${DIALECTICORE_WORKER_HEALTHCHECK_TIMEOUT:-6s}
  retries: ${DIALECTICORE_WORKER_HEALTHCHECK_RETRIES:-3}
  start_period: ${DIALECTICORE_WORKER_HEALTHCHECK_START_PERIOD:-30s}

x-bounded-json-logging: &bounded-json-logging
  logging:
    driver: json-file
    options:
      max-size: ${DIALECTICORE_DOCKER_LOG_MAX_SIZE:-10m}
      max-file: "${DIALECTICORE_DOCKER_LOG_MAX_FILE:-5}"

x-process-resource-limits: &process-resource-limits
  cpus: ${DIALECTICORE_DOCKER_CPU_LIMIT:-2.0}
  mem_limit: ${DIALECTICORE_DOCKER_MEMORY_LIMIT:-2g}
  memswap_limit: ${DIALECTICORE_DOCKER_MEMORY_SWAP_LIMIT:-2g}
  pids_limit: ${DIALECTICORE_DOCKER_PIDS_LIMIT:-512}
  ulimits:
    nofile:
      soft: ${DIALECTICORE_DOCKER_NOFILE_SOFT_LIMIT:-65536}
      hard: ${DIALECTICORE_DOCKER_NOFILE_HARD_LIMIT:-65536}

x-python-runtime-hardening: &python-runtime-hardening
  <<: [*bounded-json-logging, *process-resource-limits]
  init: true
  restart: unless-stopped
  stop_grace_period: ${DIALECTICORE_DOCKER_STOP_GRACE_PERIOD:-60s}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=${DIALECTICORE_DOCKER_PYTHON_TMPFS_SIZE:-512m}

x-web-runtime-hardening: &web-runtime-hardening
  <<: [*bounded-json-logging, *process-resource-limits]
  init: true
  restart: unless-stopped
  stop_grace_period: ${DIALECTICORE_DOCKER_STOP_GRACE_PERIOD:-60s}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=${DIALECTICORE_DOCKER_WEB_TMPFS_SIZE:-64m}

x-infrastructure-runtime-hardening: &infrastructure-runtime-hardening
  <<: [*bounded-json-logging, *process-resource-limits]
  init: true
  pull_policy: missing
  restart: unless-stopped
  stop_grace_period: ${DIALECTICORE_DOCKER_STOP_GRACE_PERIOD:-60s}
  security_opt:
    - no-new-privileges:true

services:
  web-ui:
    <<: *web-runtime-hardening
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${DIALECTICORE_WEB_API_BASE_URL:-}
        VITE_DIALECTICORE_ROLE: ${DIALECTICORE_WEB_ROLE:-producer}
        VITE_DIALECTICORE_USER: ${DIALECTICORE_WEB_USER:-web-ui}
    ports:
      - "${DIALECTICORE_WEB_BIND_ADDRESS:-127.0.0.1}:5173:8080"
    depends_on:
      <<: *api-ready
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080 >/dev/null 2>&1 || exit 1"]
      interval: ${DIALECTICORE_WEB_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_WEB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${DIALECTICORE_WEB_HEALTHCHECK_RETRIES:-6}
      start_period: ${DIALECTICORE_WEB_HEALTHCHECK_START_PERIOD:-10s}

  production-api:
    <<: *python-runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile.production-api
    env_file:
      - path: .env
        required: false
    environment:
      <<: *dialecticore-env
    ports:
      - "${DIALECTICORE_API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - object-storage:/data/object-storage
      - runtime-state:/data/runtime-state
      - backups:/data/backups
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: ${DIALECTICORE_API_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_API_HEALTHCHECK_TIMEOUT:-6s}
      retries: ${DIALECTICORE_API_HEALTHCHECK_RETRIES:-12}
      start_period: ${DIALECTICORE_API_HEALTHCHECK_START_PERIOD:-20s}

  temporal:
    <<: *infrastructure-runtime-hardening
    image: ${DIALECTICORE_TEMPORAL_IMAGE:-temporalio/auto-setup:1.25}
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dialecticore}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-dialecticore}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233", "--command-timeout", "5s"]
      interval: ${DIALECTICORE_TEMPORAL_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${DIALECTICORE_TEMPORAL_HEALTHCHECK_TIMEOUT:-6s}
      retries: ${DIALECTICORE_TEMPORAL_HEALTHCHECK_RETRIES:-12}
      start_period: ${DIALECTICORE_TEMPORAL_HEALTHCHECK_START_PERIOD:-20s}

  temporal-ui:
    <<: *infrastructure-runtime-hardening
    profiles:
      - ops-ui
    image: ${DIALECTICORE_TEMPORAL_UI_IMAGE:-temporalio/ui:2.31.2}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${DIALECTICORE_TEMPORAL_UI_BIND_ADDRESS:-127.0.0.1}:8088:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - edge
      - backend

  workflow-worker:
    <<: *python-runtime-hardening
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *dialecticore-env
      DIALECTICORE_WORKER_ROLE: workflow-worker
    depends_on:
      <<: *api-ready
    volumes:
      - object-storage:/data/object-storage
      - runtime-state:/data/runtime-state
    networks:
      - backend
    healthcheck: *worker-healthcheck

  temporal-worker:
    <<: *python-runtime-hardening
    profiles:
      - temporal-external
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *dialecticore-env
      DIALECTICORE_WORKER_ROLE: temporal-worker
    depends_on:
      temporal:
        condition: service_healthy
      production-api:
        condition: service_healthy
    volumes:
      - object-storage:/data/object-storage
      - runtime-state:/data/runtime-state
    networks:
