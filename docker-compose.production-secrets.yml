x-app-secret-environment: &app-secret-environment
  DIALECTICORE_ENV: production
  DIALECTICORE_DATABASE_URL: ""
  DIALECTICORE_DATABASE_DRIVER: ${DIALECTICORE_DATABASE_DRIVER:-postgresql+psycopg}
  DIALECTICORE_DATABASE_HOST: ${DIALECTICORE_DATABASE_HOST:-postgres}
  DIALECTICORE_DATABASE_PORT: ${DIALECTICORE_DATABASE_PORT:-5432}
  DIALECTICORE_DATABASE_NAME: ${DIALECTICORE_DATABASE_NAME:-${POSTGRES_DB:-dialecticore}}
  DIALECTICORE_DATABASE_USER: ${DIALECTICORE_DATABASE_USER:-${POSTGRES_USER:-dialecticore}}
  DIALECTICORE_DATABASE_PASSWORD_REFERENCE: ${DIALECTICORE_DATABASE_PASSWORD_REFERENCE:-docker-secret:postgres_password}
  DIALECTICORE_CORS_ALLOWED_ORIGINS: ${DIALECTICORE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  DIALECTICORE_AUTH_ENABLED: "true"
  DIALECTICORE_AUTH_API_KEY_REFERENCE: ${DIALECTICORE_AUTH_API_KEY_REFERENCE:-docker-secret:dialecticore_api_key}
  DIALECTICORE_OBJECT_STORAGE_ACCESS_KEY_REFERENCE: ${DIALECTICORE_OBJECT_STORAGE_ACCESS_KEY_REFERENCE:-docker-secret:minio_root_user}
  DIALECTICORE_OBJECT_STORAGE_SECRET_KEY_REFERENCE: ${DIALECTICORE_OBJECT_STORAGE_SECRET_KEY_REFERENCE:-docker-secret:minio_root_password}
  DIALECTICORE_REDIS_EVENT_FANOUT_ENABLED: "true"
  DIALECTICORE_REDIS_WORKER_SIGNAL_ENABLED: "true"
  DIALECTICORE_HEALTHCHECK_ALLOWED_STATUSES: ${DIALECTICORE_HEALTHCHECK_ALLOWED_STATUSES:-healthy,degraded}
  DIALECTICORE_API_KEY: ""
  B1_API_KEY: ""
  B1_API_KEY_FILE: ${B1_API_KEY_FILE:-/run/secrets/b1_api_key}
  OPENROUTER_API_KEY: ""
  OPENROUTER_API_KEY_FILE: ${OPENROUTER_API_KEY_FILE:-/run/secrets/openrouter_api_key}
  MINIO_ROOT_USER: ""
  MINIO_ROOT_PASSWORD: ""

x-app-secrets: &app-secrets
  - source: dialecticore_api_key
    target: dialecticore_api_key
    mode: 0444
  - source: postgres_password
    target: postgres_password
    mode: 0444
  - source: minio_root_user
    target: minio_root_user
    mode: 0444
  - source: minio_root_password
    target: minio_root_password
    mode: 0444
  - source: b1_api_key
    target: b1_api_key
    mode: 0444
  - source: openrouter_api_key
    target: openrouter_api_key
    mode: 0444

services:
  production-api:
    environment:
      <<: *app-secret-environment
    ports: !reset []
    secrets: *app-secrets

  workflow-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  temporal-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  discussion-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  research-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  localization-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  voicebox-adapter:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  comfyui-adapter:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  timeline-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  render-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  qc-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  publishing-worker:
    environment:
      <<: *app-secret-environment
    secrets: *app-secrets

  postgres:
    environment:
      POSTGRES_PASSWORD: null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
        mode: 0444

  temporal:
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_PWD="$$(cat /run/secrets/postgres_password)"
        exec /etc/temporal/entrypoint.sh "$$@"
      - --
    environment:
      POSTGRES_PWD: null
    secrets:
      - source: postgres_password
        target: postgres_password
        mode: 0444

  minio:
    environment:
      MINIO_ROOT_USER: null
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD: null
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports: !reset []
    secrets:
      - source: minio_root_user
        target: minio_root_user
        mode: 0444
      - source: minio_root_password
        target: minio_root_password
        mode: 0444

secrets:
  dialecticore_api_key:
    file: ./secrets/dialecticore_api_key
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  b1_api_key:
    file: ./secrets/b1_api_key
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
